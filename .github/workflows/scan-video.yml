name: VAL LIVE authorized video scan
on:
  workflow_dispatch:
    inputs:
      player:
        description: Player
        required: true
        type: choice
        options: [TenZ, aspas, t3xture, something]
      video_url:
        description: Direct HTTPS MP4 URL you are authorized to analyze (not a YouTube watch URL)
        required: true
        type: string
      source_url:
        description: Original source page (optional)
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: val-live-video-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download authorized media
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          python - <<'PY'
          import os,urllib.parse
          u=urllib.parse.urlsplit(os.environ['VIDEO_URL'])
          if u.scheme!='https' or not u.hostname or u.username or u.password:
              raise SystemExit('An authorized direct HTTPS video URL is required')
          PY
          curl --fail --location --max-time 1200 --max-filesize 1073741824 --output /tmp/val-live-input.mp4 "$VIDEO_URL"
      - name: Scan frames until collection is detected
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PLAYER: ${{ inputs.player }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: python scripts/scan_authorized_video.py --video /tmp/val-live-input.mp4 --player "$PLAYER" --source "$SOURCE_URL"
      - name: Commit verified candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Record AI skin candidates from authorized video"
            git push
          fi
