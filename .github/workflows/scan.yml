name: VAL-LIVE – 무료 OCR 및 스킨 이미지 자동 비교
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scan.yml'
      - 'scripts/**'
      - 'sources.json'
      - 'requirements.txt'
      - 'tests/test_fast_scan.py'
  workflow_call:
    inputs:
      player:
        description: 'Scan exactly this one player'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      force_rescan:
        description: 'Recheck previously scanned videos'
        required: false
        type: boolean
        default: true
      player:
        description: 'Scan one player only'
        required: true
        default: 'TenZ'
        type: choice
        options: [TenZ, aspas, t3xture, something]
  schedule:
    - cron: '37 0,6,12,18 * * *'
permissions:
  contents: write
concurrency:
  group: val-live-scans
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools (no paid AI API)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr
          # yt-dlp requires an external JavaScript runtime for YouTube
          node --version
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify scanner and fast VALORANT-only tests
        run: |
          python -m compileall -q scripts
          python -m unittest discover -s tests -p 'test_fast_scan.py' -v
      - name: Discover VODs and scan
        env:
          REQUESTED_PLAYER: ${{ inputs.player || '' }}
          REQUESTED_FORCE_RESCAN: ${{ inputs.force_rescan || 'false' }}
        run: |
          # Interactive/reusable runs: honor only the selected player.
          # Scheduled runs: rotate ONE player (not all four).
          case "$REQUESTED_PLAYER" in
            TenZ|aspas|t3xture|something) PLAYER="$REQUESTED_PLAYER" ;;
            "")
              HOUR="$(date -u +%-H)"
              case "$((HOUR / 6))" in
                0) PLAYER="TenZ" ;;
                1) PLAYER="aspas" ;;
                2) PLAYER="t3xture" ;;
                3) PLAYER="something" ;;
              esac
              ;;
            *) echo 'Unsupported player'; exit 1 ;;
          esac
          export PLAYER
          if [ "$REQUESTED_FORCE_RESCAN" = "true" ]; then export FORCE_RESCAN=1; fi
          echo "Running VAL-LIVE for ONE player only: $PLAYER"
          python scripts/scan.py
      - name: Publish discoveries, OCR matches and status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json scan_state.json history.json
          if ! git diff --cached --quiet; then
            git commit -m 'VAL-LIVE: compare collection screenshots against skin icon catalog'
            git pull --rebase
            git push
          fi